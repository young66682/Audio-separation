[project]
name = "fretline-backend"
version = "0.1.0"
description = "Local stem separation, custom accompaniment, and guitar transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
    "basic-pitch==0.4.0",
    "demucs==4.0.1",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "music21>=10.3,<11",
    "numpy==1.26.4",
    "python-multipart>=0.0.20,<0.1",
    "python-dotenv>=1.0,<2",
    "setuptools<81",
    "soundfile>=0.12,<0.15",
    "tensorflow-intel==2.14.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    # 固定 CUDA 构建，避免重新同步依赖时被 PyPI 的 CPU 版本覆盖。
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "uvicorn[standard]>=0.34,<0.42",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

