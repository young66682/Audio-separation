[project]
name = "fretline-backend"
version = "0.1.0"
description = "Local stem separation, custom accompaniment, and guitar transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
    "basic-pitch==0.4.0",
    "demucs==4.0.1",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "music21>=10.3,<11",
    "numpy==1.26.4",
    "python-multipart>=0.0.20,<0.1",
    "python-dotenv>=1.0,<2",
    "setuptools<81",
    "soundfile>=0.12,<0.15",
    "tensorflow-intel==2.14.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    "torch>=2.0,<2.11",
    "torchaudio>=2.0,<2.11",
    "uvicorn[standard]>=0.34,<0.42",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

